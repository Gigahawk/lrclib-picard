name: pytest
on:
  push:
  workflow_dispatch:
jobs:
  pytest:
    name: pytest
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      # Required because Windows doesn't handle symlinks properly
      - name: Resolve symlinks
        shell: bash
        run: |
          cd src/lrclib_picard
          mkdir temp
          cp -r lrclib_py/* temp
          rm lrclib_py
          mv temp lrclib_py
      - name: Install deps (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt install gettext
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.*
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run pytest
