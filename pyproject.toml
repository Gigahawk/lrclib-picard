[build-system]
requires = ["setuptools<75.3", "wheel<0.44"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest<=8.3.4",
    # pyqt5 build requirements
    "pyqt-builder>=1.19.1",
    "sip>=6.8.6",
]

[project]
name = "lrclib-picard"
version = "0.1.0"
description = "LRCLIB plugin for MusicBrainz Picard"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "picard>=2.13.3",
]
